name: Tests

# Build the third-party workspace once per arch (prime-third-party), cache it,
# then run the unit tests and the log-service tests against the restored prefix.
# All jobs run on eloqdata/ubuntu-dev:24.04 (system build deps baked in); the
# third-party prefix is the only thing built/cached here. Runs on amd64+arm64.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The container's default run shell is `sh` (dash); force bash so array/here-doc
# and `set -o pipefail` in any step behave predictably.
defaults:
  run:
    shell: bash

jobs:
  # Build (and cache) the third-party workspace once per arch so the test jobs
  # below restore it instead of each rebuilding it from source on a cold cache.
  prime-third-party:
    name: prime-third-party (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      options: --user root
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup third-party (cached)
        uses: ./.github/actions/setup-third-party
        with:
          arch: ${{ matrix.arch }}
          cache-scope: ubuntu-dev

  unit-tests:
    needs: prime-third-party
    name: unit-tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      # Run as root so actions/checkout can write the runner file-command files
      # under /__w/_temp; otherwise checkout fails with EACCES in this image.
      options: --user root
    env:
      # third-party is built from source into this prefix (not /usr/local); the
      # build locates it through these standard CMake/loader vars + the explicit
      # -DELOQ_THIRD_PARTY_PREFIX below.
      ELOQ_THIRD_PARTY_PREFIX: /opt/eloq/third_party
      CMAKE_PREFIX_PATH: /opt/eloq/third_party
      CMAKE_INCLUDE_PATH: /opt/eloq/third_party/include
      CMAKE_LIBRARY_PATH: /opt/eloq/third_party/lib
      LD_LIBRARY_PATH: /opt/eloq/third_party/lib
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup third-party (cached)
        uses: ./.github/actions/setup-third-party
        with:
          arch: ${{ matrix.arch }}
          cache-scope: ubuntu-dev

      - name: Configure
        run: |
          mkdir -p bld && cd bld
          cmake .. -DWITH_TESTS=ON \
            -DWITH_DATA_STORE=ELOQDSS_ELOQSTORE \
            -DWITH_LOG_STATE=ROCKSDB \
            -DCMAKE_BUILD_TYPE=Debug \
            -DELOQ_THIRD_PARTY_PREFIX=/opt/eloq/third_party \
            -DELOQ_THIRD_PARTY_REQUIRED=ON

      - name: Build
        run: cmake --build bld --parallel "$(nproc)"

      - name: Test (gating — full suite)
        working-directory: bld
        run: ctest --output-on-failure --timeout 180

      - name: Configure RocksDB Cloud S3
        run: |
          cmake -S . -B bld_rocksdb_cloud \
            -DWITH_TESTS=ON \
            -DWITH_DATA_STORE=ELOQDSS_ROCKSDB_CLOUD_S3 \
            -DWITH_LOG_STATE=ROCKSDB_CLOUD_S3 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DELOQ_THIRD_PARTY_PREFIX=/opt/eloq/third_party \
            -DELOQ_THIRD_PARTY_REQUIRED=ON

      - name: Build RocksDB Cloud S3
        run: cmake --build bld_rocksdb_cloud --parallel "$(nproc)"

      - name: Test (gating — RocksDB Cloud S3 full suite)
        working-directory: bld_rocksdb_cloud
        run: ctest --output-on-failure --timeout 180

  log-service-tests:
    needs: prime-third-party
    name: log-service-tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      options: --user root
    env:
      ELOQ_THIRD_PARTY_PREFIX: /opt/eloq/third_party
      CMAKE_PREFIX_PATH: /opt/eloq/third_party
      CMAKE_INCLUDE_PATH: /opt/eloq/third_party/include
      CMAKE_LIBRARY_PATH: /opt/eloq/third_party/lib
      LD_LIBRARY_PATH: /opt/eloq/third_party/lib
      # Consumed by eloq_log_service/test/test_utils.h + the cloud test harness:
      # routes rocksdb-cloud's S3 client at RustFS with path-style addressing.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup third-party (cached)
        uses: ./.github/actions/setup-third-party
        with:
          arch: ${{ matrix.arch }}
          cache-scope: ubuntu-dev

      - name: Check image-provided S3 test server
        # The shared ubuntu-dev image pins RustFS for EloqKV and EloqDoc too.
        run: |
          if ! command -v rustfs >/dev/null 2>&1; then
            echo "RustFS is missing; use an ubuntu-dev image with RustFS preinstalled." >&2
            exit 1
          fi
          rustfs --version

      - name: Compile-check (RocksDB, all test targets)
        run: |
          cmake -S eloq_log_service -B eloq_log_service/bld \
            -DCMAKE_BUILD_TYPE=Debug -DWITH_LOG_STATE=ROCKSDB \
            -DELOQ_THIRD_PARTY_PREFIX=/opt/eloq/third_party \
            -DELOQ_THIRD_PARTY_REQUIRED=ON
          cmake --build eloq_log_service/bld --parallel "$(nproc)"

      - name: Build cloud variant (RocksDB-Cloud S3 + Catch2 tests)
        run: |
          cmake -S eloq_log_service -B eloq_log_service/bld_cloud \
            -DCMAKE_BUILD_TYPE=Debug -DWITH_LOG_STATE=ROCKSDB_CLOUD_S3 \
            -DELOQ_THIRD_PARTY_PREFIX=/opt/eloq/third_party \
            -DELOQ_THIRD_PARTY_REQUIRED=ON
          cmake --build eloq_log_service/bld_cloud --parallel "$(nproc)"

      - name: Run cloud unit tests against RustFS
        # Keep the server in this step and clean it up even when the test fails.
        run: |
          rustfs_run_dir=$(mktemp -d /tmp/tx-service-rustfs.XXXXXX)
          rustfs_pid=
          cleanup() {
            local result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              cat "${rustfs_run_dir}/rustfs.log" >&2 || true
            fi
            if [ -n "$rustfs_pid" ]; then
              kill "$rustfs_pid" 2>/dev/null || true
              wait "$rustfs_pid" 2>/dev/null || true
            fi
            rm -rf "$rustfs_run_dir" || true
            exit "$result"
          }
          trap cleanup EXIT
          mkdir -p "${rustfs_run_dir}/data"
          RUSTFS_ACCESS_KEY="$AWS_ACCESS_KEY_ID" RUSTFS_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            RUSTFS_ADDRESS="${TEST_S3_ENDPOINT#http://}" RUSTFS_CONSOLE_ENABLE=false \
            rustfs server "${rustfs_run_dir}/data" > "${rustfs_run_dir}/rustfs.log" 2>&1 &
          rustfs_pid=$!
          ok=0
          for i in $(seq 1 60); do
            if ! kill -0 "$rustfs_pid" 2>/dev/null; then
              echo "RustFS exited before becoming ready." >&2
              exit 1
            fi
            if curl -sf --noproxy '*' --max-time 2 "${TEST_S3_ENDPOINT}/health/ready" >/dev/null 2>&1; then
              ok=1; echo "RustFS is ready"; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "RustFS did not become ready at ${TEST_S3_ENDPOINT}." >&2
            exit 1
          fi
          # test_rocksdb_cloud_sst_reader exercises the rocksdb-cloud storage
          # provider end-to-end against RustFS. The DBCloud::Open-based cases
          # currently crash inside librocksdb-cloud (ABI/vtable mismatch) and are
          # tracked separately, so they are excluded here.
          cd eloq_log_service/bld_cloud
          ./log_server_rocksdb_cloud_tests "test_rocksdb_cloud_sst_reader" \
            --region us-east-1 \
            --aws_access_key_id "$AWS_ACCESS_KEY_ID" \
            --aws_secret_key "$AWS_SECRET_ACCESS_KEY"
