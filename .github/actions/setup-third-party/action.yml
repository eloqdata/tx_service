name: Setup third-party
description: >
  Restore the eloq third-party workspace from cache, or build it from source and
  cache it. The cache key covers everything that determines the built prefix: the
  third-party build scripts (fetch.sh pins the archive deps by URL/commit), the
  manifest, the patches, the system-package list, and the pinned source submodule
  commits (brpc / braft / mimalloc / rocksdb-cloud).

inputs:
  arch:
    description: amd64 or arm64 (keeps per-arch caches separate).
    required: true
  cache-scope:
    description: >
      Build-environment id folded into the cache key so binaries built in
      different images are not shared. data_substrate builds only on
      eloqdata/ubuntu-dev, so this is normally 'ubuntu-dev'.
    required: true
  prefix:
    description: Install prefix to cache.
    default: /opt/eloq/third_party

outputs:
  cache-hit:
    description: 'true if the prefix was restored from cache.'
    value: ${{ steps.tp-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute third-party cache key
      id: tp-key
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        # Mode 160000 entries are gitlinks. Hash them directly from the index,
        # without initializing submodules or duplicating their commits in the
        # dependency manifest.
        h=$({
              git ls-files -s -- \
                .gitmodules \
                scripts/third_party \
                third_party/manifest.yml \
                third_party/patches \
                third_party/system-packages.ubuntu2404.txt
              git ls-files -s -- third_party/src \
                | awk '$1 == "160000"'
            } | sha256sum | cut -c1-16)
        echo "key=tp-${{ inputs.arch }}-${{ inputs.cache-scope }}-${h}" >> "$GITHUB_OUTPUT"

    - name: Restore third-party cache
      id: tp-cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.prefix }}
        key: ${{ steps.tp-key.outputs.key }}

    - name: Build third-party from source (cache miss)
      if: steps.tp-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ELOQ_THIRD_PARTY_PREFIX: ${{ inputs.prefix }}
      run: |
        git config --global --add safe.directory '*'
        # The retained source submodules come from the recursive checkout; this
        # installs the system packages, fetches the archive deps, and builds
        # everything into the (cacheable) prefix.
        bash scripts/third_party/install-ubuntu2404.sh
        test -d "${{ inputs.prefix }}/lib"
